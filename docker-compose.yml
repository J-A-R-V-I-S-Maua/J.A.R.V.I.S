services:
  redis:
    image: redis:7-alpine
    cpuset: "0-1"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build: ./worker
    cpus: "4"
    cpuset: "4-5"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BACKEND_URL=redis://redis:6379/0
      - AUDIO_UPLOAD_DIR=/app/audio_uploads
      - AUDIO_RETENTION_HOURS=24
    volumes:
      - whisper-cache:/root/.cache/huggingface
      - audio-uploads:/app/audio_uploads
    command: celery -A task worker --loglevel=info --pool=solo
    restart: unless-stopped

  beat:
    build: ./worker
    cpuset: "2-3"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BACKEND_URL=redis://redis:6379/0
    command: celery -A task beat --loglevel=info
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    cpuset: "2-3"
    cpus: "2"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_BACKEND_URL=redis://redis:6379/0
      - AUDIO_UPLOAD_DIR=/app/audio_uploads
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:4b-instruct}
    ports:
      - "8000:8000"
    volumes:
      - audio-uploads:/app/audio_uploads
    restart: unless-stopped

volumes:
  redis-data:
  whisper-cache:
  audio-uploads:
